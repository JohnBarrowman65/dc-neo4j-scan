name: Dependency-Check Scan for spring-data-neo4j 6.3.18
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Maven settings (Aliyun mirror)
        run: |
          mkdir -p ~/.m2
          echo -e '<?xml version="1.0" encoding="UTF-8"?>\n<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n  <mirrors>\n    <mirror>\n      <id>aliyunmaven</id>\n      <mirrorOf>central</mirrorOf>\n      <name>阿里云 public mirror</name>\n      <url>https://maven.aliyun.com/repository/public</url>\n    </mirror>\n  </mirrors>\n</settings>' > ~/.m2/settings.xml

      - name: Debug - print maven settings
        run: cat ~/.m2/settings.xml

      - name: Cache Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dc-db-${{ hashFiles('pom.xml') }}
          restore-keys: dc-db-

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ hashFiles('pom.xml') }}
          restore-keys: maven-repo-

      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check -DnvdApiKey=${{ secrets.NVD_API_KEY }} -DnvdApiDelay=3000 -DnvdMaxRetryCount=5

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: dc-report-html
          path: target/report/
