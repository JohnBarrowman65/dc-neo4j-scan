name: Dependency-Check Scan for spring-data-neo4j 6.3.18
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 缓存OWASP Dependency-Check的NVD数据库，大幅提升后续运行速度
      - name: Cache OWASP DC Database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dc-db-${{ hashFiles('pom.xml') }}
          restore-keys: dc-db-

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          maven-settings-file: '${{ github.workspace }}/settings.xml'

      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: dc-report-html
          path: target/report/
