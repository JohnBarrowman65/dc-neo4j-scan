name: Dependency-Check Scan for spring-data-neo4j 6.3.18
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Maven settings (Aliyun mirror)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
  <mirrors>
    <mirror>
      <id>aliyunmaven</id>
      <mirrorOf>central</mirrorOf>
      <name>阿里云 public mirror</name>
      <url>https://maven.aliyun.com/repository/public</url>
    </mirror>
  </mirrors>
</settings>
EOF

      - name: Cache Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dc-db-${{ hashFiles('pom.xml') }}
          restore-keys: dc-db-

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          # 移除 cache: maven，避免和手动缓存冲突
          # 不再传入 maven-settings-file 参数

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ hashFiles('pom.xml') }}
          restore-keys: maven-repo-

      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check -DnvdApiKey=${{ secrets.NVD_API_KEY }} -DnvdApiDelay=3000 -DnvdMaxRetryCount=5

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: dc-report-html
          path: target/report/
