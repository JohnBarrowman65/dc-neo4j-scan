name: Dependency-Check Scan for spring-data-neo4j 6.3.18
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ✅ 手动写入阿里云settings，保证镜像一定生效（重点改动！）
      - name: Prepare maven settings (aliyun mirror)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
  <mirrors>
    <mirror>
      <id>aliyunmaven</id>
      <mirrorOf>central</mirrorOf>
      <name>阿里云公共仓库</name>
      <url>https://maven.aliyun.com/repository/public</url>
    </mirror>
  </mirrors>
</settings>
EOF

      - name: Cache OWASP DC Database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dc-db-${{ hashFiles('pom.xml') }}
          restore-keys: dc-db-

      - name: Cache Maven repository 【新增maven本地仓库缓存，大幅提速】
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ hashFiles('pom.xml') }}
          restore-keys: maven-repo-

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          # 删掉 maven-settings-file 这一行，不再用它，避免不生效的坑

      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check -DnvdApiKey=${{ secrets.NVD_API_KEY }} -DnvdApiDelay=3000 -DnvdMaxRetryCount=5
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: dc-report-html
          path: target/report/
